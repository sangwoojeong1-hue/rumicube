/* =====================================================================
   온라인 대전 — Firebase 연결 (시험할 때는 가짜 서버로 바꿔 끼울 수 있음)
   ===================================================================== */
function onlineReady(){ return !!(window.__RUMMI_NET__ || (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL && window.firebase)); }
function makeFirebaseNet(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth(), db = firebase.database();
  let offset = 0;
  db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
  return {
    uid: null,
    async init(){ if (!auth.currentUser) await auth.signInAnonymously(); this.uid = auth.currentUser.uid; },
    now: () => Date.now() + offset,
    on(path, cb){ const r = db.ref(path); const h = s => cb(s.val()); r.on('value', h, () => cb(null)); return () => r.off('value', h); },
    async get(path){ return (await db.ref(path).get()).val(); },
    set: (path, v) => db.ref(path).set(v),
    update: map => db.ref().update(map),
    remove: path => db.ref(path).remove(),
    push: (path, v) => db.ref(path).push(v),
    async txn(path, fn){ const r = await db.ref(path).transaction(fn); return r.committed; },
    onDisconnectSet: (path, v) => db.ref(path).onDisconnect().set(v),
    cancelDisconnect: path => db.ref(path).onDisconnect().cancel(),
    onConnected(cb){ db.ref('.info/connected').on('value', s => cb(!!s.val())); },
  };
}
let net = null;
async function getNet(){
  if (net) return net;
  if (window.__RUMMI_NET__) net = window.__RUMMI_NET__();      // 시험용 가짜 서버
  else if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL && window.firebase) net = makeFirebaseNet();
  else throw new Error('noconfig');
  await net.init();
  return net;
}
const sess = {
  get(k){ try { return JSON.parse(sessionStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v){ try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function normGame(g){
  if (!g) return null;
  g.seats = arr(g.seats); g.board = arr(g.board).map(s => arr(s).map(Number)).filter(s => s.length); g.lastPlayed = arr(g.lastPlayed);
  if (g.result) g.result.rows = arr(g.result.rows).map(r => Object.assign(r, { tiles: arr(r.tiles) }));
  return g;
}
function showScreen(id){ ['startScreen', 'lobbyScreen', 'gameScreen'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }

// 온라인 상태 (G는 이 상태를 '나 = 0번' 기준으로 돌려 맞춘 화면용 판이라, 기존 화면 그리기를 그대로 씀)
const O = {
  code: null, uid: null, name: '', meta: null, players: {}, game: null, hand: [], preview: null, previewOn: false,
  order: [], isHost: false, engine: null, unsub: [], timers: [], hostTimers: [], hostUnsub: null, hostLastTurn: null,
  pending: false, pendingAt: 0, workTurn: null, lastLog: '', lastTurnId: null, resultShown: null,
  pvTimer: null, pvSent: '', lastViewBoard: null, timerFor: '', lastReject: 0,
};
function mySeat(){ return O.game ? O.game.seats.findIndex(s => s.id === O.uid) : -1; }

/* ---------- 방 만들기 / 들어가기 ---------- */
function readName(){
  const v = $('nameInput').value.trim().slice(0, 8);
  if (!v) { $('nameInput').focus(); showModal(`<h2>닉네임을 적어 주세요</h2><p class="sub">친구들이 알아볼 수 있는 별명이면 돼요 (실명은 쓰지 마세요)</p>
    <div class="modal-actions"><button class="btn primary" id="mOk">알겠어요</button></div>`, m => m.querySelector('#mOk').onclick = () => { closeModal(); $('nameInput').focus(); }); return null; }
  prefs.name = v; store(PREF_KEY, prefs);
  return v;
}
function infoModal(title, msg){
  showModal(`<h2>${title}</h2><p class="sub">${msg}</p><div class="modal-actions"><button class="btn primary" id="mOk">알겠어요</button></div>`,
    m => m.querySelector('#mOk').onclick = closeModal);
}
async function connectOrExplain(){
  try { return await getNet(); }
  catch (e) {
    infoModal('온라인에 연결할 수 없어요', e.message === 'noconfig' ? '온라인 설정이 아직 안 됐어요.<br>선생님께 알려 주세요 (사용안내 2단계).' : '인터넷 연결을 확인해 주세요.<br>혼자 하기·모둠전은 그대로 할 수 있어요.');
    return null;
  }
}
$('createBtn').onclick = async () => {
  const name = readName(); if (!name) return;
  const n = await connectOrExplain(); if (!n) return;
  $('createBtn').disabled = true;
  try {
    cleanupOldRooms(n);
    let code = null;
    for (let k = 0; k < 20 && !code; k++) {
      const c = String(1000 + Math.floor(Math.random() * 9000));
      if (await n.txn(`roomIndex/${c}`, cur => cur ? undefined : { created: n.now() })) code = c;
    }
    if (!code) throw new Error('code');
    const now = n.now();
    await n.update({
      [`rooms/${code}/meta`]: { host: n.uid, status: 'lobby', created: now, hostBeat: now, v: CONFIG.APP_VERSION, settings: CONFIG.ONLINE.DEFAULTS },
      [`rooms/${code}/players/${n.uid}`]: { name, joined: now, online: true },
    });
    enterRoom(code, name);
  } catch (e) { toastAnywhere('방을 만들지 못했어요. 다시 해 주세요'); }
  $('createBtn').disabled = false;
};
async function cleanupOldRooms(n){
  try {
    const idx = await n.get('roomIndex') || {};
    const limit = n.now() - CONFIG.ONLINE.ROOM_EXPIRE_HOURS * 3600 * 1000;
    for (const [c, v] of Object.entries(idx)) {
      if (v && v.created < limit) { n.remove(`rooms/${c}`).catch(() => {}); n.remove(`roomIndex/${c}`).catch(() => {}); }
    }
  } catch (e) {}
}
// 시작 화면에는 알림 줄이 없어서 작은 팝업으로 알림
function toastAnywhere(msg){ if (!$('gameScreen').classList.contains('hidden')) toast(msg, true); else infoModal('잠깐만요', msg); }

$('joinBtn').onclick = () => {
  const name = readName(); if (!name) return;
  let typed = '';
  showModal(`<h2>방 코드 입력</h2><div class="code-big" id="cDigits"></div><div class="summary" id="cMsg"></div>
    <div class="keypad" id="cPad">${[1,2,3,4,5,6,7,8,9].map(k => `<button data-k="${k}">${k}</button>`).join('')}
      <button class="fn" data-k="clr">지우기</button><button data-k="0">0</button><button class="fn" data-k="back">←</button></div>
    <div class="modal-actions"><button class="btn" id="mNo">취소</button><button class="btn primary" id="mGo" disabled>들어가기</button></div>`, m => {
      const draw = () => {
        m.querySelector('#cDigits').innerHTML = [0,1,2,3].map(i => `<span class="${typed[i] ? '' : 'empty'}">${typed[i] || ''}</span>`).join('');
        m.querySelector('#mGo').disabled = typed.length !== 4;
      };
      m.querySelector('#cPad').onclick = e => {
        const b = e.target.closest('button'); if (!b) return;
        const k = b.dataset.k;
        if (k === 'clr') typed = ''; else if (k === 'back') typed = typed.slice(0, -1); else if (typed.length < 4) typed += k;
        m.querySelector('#cMsg').textContent = '';
        draw();
      };
      m.querySelector('#mNo').onclick = closeModal;
      m.querySelector('#mGo').onclick = async () => {
        m.querySelector('#mGo').disabled = true;
        const why = await joinRoom(typed, name);
        if (why !== true && $('modalRoot').contains(m)) { m.querySelector('#cMsg').textContent = why; m.querySelector('#mGo').disabled = false; }
      };
      draw();
    });
};
// 들어가면 true, 못 들어가면 그 이유(문구)를 돌려줌
async function joinRoom(code, name){
  const n = await getNet().catch(() => null);
  if (!n) { closeModal(); connectOrExplain(); return '연결할 수 없어요'; }
  try {
    const meta = await n.get(`rooms/${code}/meta`);
    if (!meta) return '그런 방이 없어요. 코드를 다시 확인해 주세요';
    const players = await n.get(`rooms/${code}/players`) || {};
    const now = n.now();
    if (meta.status === 'lobby') {
      const others = Object.entries(players).filter(([u, p]) => u !== n.uid && p && p.online);
      if (!players[n.uid] && others.length >= 4) return '자리가 없어요 (한 방에 4명까지)';
      if (others.some(([, p]) => p.name === name)) return `이 방에 벌써 「${name}」이(가) 있어요. 다른 닉네임을 써 주세요`;
      await n.set(`rooms/${code}/players/${n.uid}`, { name, joined: (players[n.uid] && players[n.uid].joined) || now, online: true });
    } else {
      // 이미 시작한 방: 같은 닉네임의 끊긴 자리가 있으면 그 자리로 돌아감 (새 학생은 다음 판에)
      const game = normGame(await n.get(`rooms/${code}/game`));
      const mine = game && game.seats.find(s => s.id === n.uid);
      const back = game && game.seats.find(s => !s.cpu && s.name === name && !(players[s.id] && players[s.id].online));
      if (!mine && !back) return '이미 게임 중인 방이에요. 이번 판이 끝나면 들어올 수 있어요';
      await n.set(`rooms/${code}/players/${n.uid}`, { name: mine ? mine.name : back.name, joined: (players[n.uid] && players[n.uid].joined) || now, online: true });
    }
    closeModal();
    enterRoom(code, name);
    return true;
  } catch (e) { return '들어가지 못했어요. 다시 해 주세요'; }
}

/* ---------- 방 안 ---------- */
function enterRoom(code, name){
  cleanupOnline();
  clearTimeout(cpuTimer); stopTurnTimer();
  O.code = code; O.uid = net.uid; O.name = name; O.lastReject = net.now();
  sess.set('rummi_room', { code, name });
  const base = `rooms/${code}`;
  net.onConnected(c => {
    if (O.code !== code) return;
    $('netBanner').classList.toggle('show', !c);
    if (!c) return;
    net.onDisconnectSet(`${base}/players/${net.uid}/online`, false);
    net.set(`${base}/players/${net.uid}/online`, true).catch(() => {});
  });
  O.unsub.push(net.on(`${base}/meta`, meta => {
    if (O.code !== code) return;
    if (!meta) return roomClosed();
    const wasStatus = O.meta && O.meta.status;
    O.meta = meta;
    const amHost = meta.host === net.uid;
    if (amHost && !O.isHost) becomeHost();
    if (!amHost && O.isHost) stopHost();
    if (meta.status === 'lobby') {
      if (wasStatus && wasStatus !== 'lobby') { O.game = null; G = null; stopTurnTimer(); closeModal(); }
      showScreen('lobbyScreen'); renderLobby();
    } else if (O.game) { showScreen('gameScreen'); syncView(); }
  }));
  O.unsub.push(net.on(`${base}/players`, p => {
    O.players = p || {};
    const me = O.players[net.uid];
    // 심판이 받아주지 않은 행동 알림 (들어오기 전의 옛 알림은 무시)
    if (me && me.reject && me.reject.t > O.lastReject) { O.lastReject = me.reject.t; toast(me.reject.reason, true, 3600); O.pending = false; }
    if (O.meta && O.meta.status === 'lobby') renderLobby();
    if (O.isHost) hostSyncPlayers();
  }));
  O.unsub.push(net.on(`${base}/game`, g => {
    const prevTurn = O.game && O.game.turnId;
    O.game = normGame(g);
    if (!O.game) return;
    if (O.game.turnId !== prevTurn) O.pending = false;
    if (O.meta && O.meta.status !== 'lobby') { showScreen('gameScreen'); syncView(); }
  }));
  O.unsub.push(net.on(`${base}/hands/${net.uid}`, h => { O.hand = arr(h).map(Number); if (O.game) syncView(); }));
  O.unsub.push(net.on(`${base}/preview`, pv => {
    O.preview = pv ? { turnId: pv.turnId, board: arr(pv.board).map(s => arr(s).map(Number)).filter(s => s.length) } : null;
    if (O.game && O.game.turn !== mySeat()) syncView();
  }));
  O.timers.push(setInterval(checkHostAlive, 2000));
  O.timers.push(setInterval(tickOnlineChips, 250));
  // 심판 응답이 오지 않으면 다시 조작할 수 있게 풂 (인터넷이 잠깐 끊겼을 때)
  O.timers.push(setInterval(() => { if (O.pending && Date.now() - O.pendingAt > 6000) { O.pending = false; if (G) render(); } }, 1000));
}
function roomClosed(){
  const inRoom = !!O.code;
  cleanupOnline(); sess.set('rummi_room', null);
  G = null; stopTurnTimer();
  showScreen('startScreen'); renderStart();
  if (inRoom) infoModal('방이 닫혔어요', '방장이 방을 닫았거나 오래되어 정리됐어요.');
}
function cleanupOnline(){
  O.unsub.forEach(f => { try { f(); } catch (e) {} }); O.unsub = [];
  O.timers.forEach(t => clearInterval(t)); O.timers = [];
  stopHost();
  clearTimeout(O.pvTimer);
  if (net && O.code) { try { net.cancelDisconnect(`rooms/${O.code}/players/${net.uid}/online`); } catch (e) {} }
  Object.assign(O, { code: null, meta: null, players: {}, game: null, hand: [], preview: null, previewOn: false, order: [], engine: null,
    pending: false, workTurn: null, lastLog: '', lastTurnId: null, resultShown: null, pvTimer: null, pvSent: '', lastViewBoard: null, timerFor: '' });
  $('netBanner').classList.remove('show');
  closeModal();
}
async function checkHostAlive(){
  const m = O.meta; if (!m || O.isHost || !net) return;
  if (net.now() - (m.hostBeat || 0) <= CONFIG.ONLINE.HOST_TIMEOUT_SEC * 1000) return;
  // 남은 학생 중 가장 먼저 들어온 사람이 심판을 이어받음
  const cands = Object.entries(O.players).filter(([u, p]) => p && p.online && u !== m.host).sort((a, b) => a[1].joined - b[1].joined);
  if (!cands.length || cands[0][0] !== net.uid) return;
  await net.txn(`rooms/${O.code}/meta`, cur => {
    if (!cur) return undefined;
    if (net.now() - (cur.hostBeat || 0) <= CONFIG.ONLINE.HOST_TIMEOUT_SEC * 1000) return undefined;
    cur.host = net.uid; cur.hostBeat = net.now();
    return cur;
  });
}

/* ---------- 방장(심판) ---------- */
async function becomeHost(){
  O.isHost = true;
  const base = `rooms/${O.code}`;
  O.hostTimers = [];
  const beat = () => net.update({ [`${base}/meta/hostBeat`]: net.now() }).catch(() => {});
  beat();
  O.hostTimers.push(setInterval(beat, CONFIG.ONLINE.HOST_BEAT_SEC * 1000));
  O.engine = makeRummiEngine({
    now: () => net.now(),
    commit: (g, H, P) => {
      const upd = { [`${base}/game`]: g, [`${base}/secret`]: { pool: P.length ? P : null } };
      const hands = {}; Object.keys(H).forEach(k => hands[k] = H[k].length ? H[k] : null);
      upd[`${base}/hands`] = hands;
      if (g.turnId !== O.hostLastTurn) { upd[`${base}/preview`] = null; O.hostLastTurn = g.turnId; }   // 차례가 바뀌면 임시 판 지우기
      net.update(JSON.parse(JSON.stringify(upd))).catch(() => {});
    },
    isAway: i => { const s = O.engine && O.engine.game && O.engine.game.seats[i]; return !!s && !s.cpu && !(O.players[s.id] && O.players[s.id].online); },
  });
  // 이어받은 경우: 판·모든 패·더미를 읽어 와서 계속
  if (O.meta && O.meta.status !== 'lobby') {
    const g = normGame(await net.get(`${base}/game`));
    if (g) {
      const H = {};
      for (const s of g.seats) H[s.id] = arr(await net.get(`${base}/hands/${s.id}`)).map(Number);
      const P = arr((await net.get(`${base}/secret`) || {}).pool).map(Number);
      O.engine.load(g, H, P);
      O.hostLastTurn = g.turnId;
      if (g.phase === 'play') { g.turnEnds = net.now() + rules(g.mode).TURN_SECONDS * 1000; g.cpuAt = 0; }
      hostSyncPlayers();
      O.engine.touch();                     // 새 마감 시각을 모두에게 알림
      toast('이제 내 태블릿이 심판을 맡아요', false, 2600);
    }
  }
  O.hostUnsub = net.on(`${base}/actions`, acts => {
    if (!acts || !O.engine || !O.engine.game) return;
    const g = O.engine.game;
    for (const [key, a] of Object.entries(acts)) {
      net.remove(`${base}/actions/${key}`).catch(() => {});
      const i = g.seats.findIndex(s => s.id === a.uid);
      if (i < 0 || a.turnId !== g.turnId) continue;
      const r = O.engine.act(i, a.kind, a.board);
      if (!r.ok) net.set(`${base}/players/${a.uid}/reject`, { reason: r.reason, t: net.now() }).catch(() => {});
    }
  });
  O.hostTimers.push(setInterval(() => O.engine && O.engine.tick(), 300));
  O.hostTimers.push(setInterval(hostSyncPlayers, 2000));   // 끊김·재입장을 주기적으로 다시 맞춤
  if (O.meta && O.meta.status === 'lobby') renderLobby();
}
function stopHost(){
  (O.hostTimers || []).forEach(t => clearInterval(t)); O.hostTimers = [];
  if (O.hostUnsub) { O.hostUnsub(); O.hostUnsub = null; }
  O.isHost = false;
}
function hostSyncPlayers(){
  const E = O.engine; if (!E || !E.game || E.game.phase !== 'play') return;
  const g = E.game;
  // 다시 들어온 학생: 같은 닉네임의 끊긴 자리를 새 기기에 넘겨줌
  for (const [u, p] of Object.entries(O.players)) {
    if (!p || !p.online || g.seats.some(s => s.id === u)) continue;
    const i = g.seats.findIndex(s => !s.cpu && s.name === p.name && !(O.players[s.id] && O.players[s.id].online));
    if (i >= 0) { const old = g.seats[i].id; E.reassignSeat(i, u); net.remove(`rooms/${O.code}/players/${old}`).catch(() => {}); }
  }
  g.seats.forEach((s, i) => { if (!s.cpu) E.setAway(i, !(O.players[s.id] && O.players[s.id].online)); });
}

/* ---------- 대기실 ---------- */
function lobbyHumans(){ return Object.entries(O.players).filter(([, p]) => p && p.online).sort((a, b) => a[1].joined - b[1].joined).slice(0, 4); }
function renderLobby(){
  const m = O.meta; if (!m) return;
  const set = Object.assign({}, CONFIG.ONLINE.DEFAULTS, m.settings || {});
  const host = m.host === net.uid;
  $('lobbyCode').innerHTML = O.code.split('').map(d => `<span>${d}</span>`).join('');
  const humans = lobbyHumans();
  const total = Math.max(set.seats, humans.length);
  let html = '';
  for (let k = 0; k < 4; k++) {
    if (k < humans.length) {
      const [u, p] = humans[k];
      const who = (u === m.host ? '👑 방장' : '친구') + (u === net.uid ? ' · 나' : '');
      html += `<div class="seat filled ${u === net.uid ? 'me' : ''}"><span class="who">${who}</span><span class="nm">${esc(p.name)}</span></div>`;
    } else if (k < total) html += `<div class="seat cpu"><span class="who">빈자리</span><span class="nm">🤖 컴퓨터</span></div>`;
    else html += `<div class="seat"><span class="who">　</span><span class="nm">—</span></div>`;
  }
  $('lobbySeats').innerHTML = html;
  const row = (opt, items) => {
    $('lobbyOpts').querySelector(`[data-opt="${opt}"]`).innerHTML = items.map(([v, t, off]) =>
      `<button class="tg ${String(set[opt]) === String(v) ? 'on' : ''}" data-v="${v}" ${host && !off ? '' : 'disabled'}>${t}</button>`).join('');
  };
  row('mode', [['quick', `빠른 판 ${CONFIG.QUICK.TURN_SECONDS}초`], ['full', `정식 ${CONFIG.FULL.TURN_SECONDS}초`]]);
  row('seats', CONFIG.ONLINE.SEAT_OPTIONS.map(v => [v, `${v}명`, v < humans.length]));
  $('startBtn').classList.toggle('hidden', !host);
  $('lobbyMsg').textContent = host
    ? (humans.length < 2 ? '친구들에게 방 코드를 알려 주세요 · 혼자서도 컴퓨터와 시작할 수 있어요' : `${humans.length}명${total > humans.length ? ` + 컴퓨터 ${total - humans.length}명` : ''}으로 시작해요`)
    : '방장이 시작하길 기다리는 중…';
}
$('lobbyOpts').addEventListener('click', e => {
  const b = e.target.closest('.tg'); if (!b || b.disabled || !O.meta || O.meta.host !== net.uid) return;
  const opt = b.parentElement.dataset.opt;
  const set = Object.assign({}, CONFIG.ONLINE.DEFAULTS, O.meta.settings || {}, { [opt]: opt === 'seats' ? Number(b.dataset.v) : b.dataset.v });
  net.set(`rooms/${O.code}/meta/settings`, set).catch(() => {});
});
$('startBtn').onclick = () => {
  if (!O.isHost || !O.engine) return;
  const set = Object.assign({}, CONFIG.ONLINE.DEFAULTS, O.meta.settings || {});
  const humans = lobbyHumans();
  const total = Math.max(set.seats, humans.length);
  const seats = humans.map(([u, p]) => ({ id: u, name: p.name }));
  for (let k = 1; seats.length < total; k++) seats.push({ id: 'cpu' + k, name: CONFIG.CPU_NAMES[k - 1], cpu: true });
  net.update({ [`rooms/${O.code}/actions`]: null, [`rooms/${O.code}/preview`]: null });
  O.engine.newGame(seats, set);
  net.update({ [`rooms/${O.code}/meta/status`]: 'playing' });
};
$('leaveLobbyBtn').onclick = () => leaveRoom();
async function leaveRoom(){
  if (net && O.code) {
    const code = O.code, base = `rooms/${code}`;
    const others = Object.entries(O.players).filter(([u, p]) => p && p.online && u !== net.uid).sort((a, b) => a[1].joined - b[1].joined);
    try {
      if (O.isHost && !others.length) { await net.remove(base); await net.remove(`roomIndex/${code}`); }
      else {
        if (O.isHost) await net.update({ [`${base}/meta/host`]: others[0][0], [`${base}/meta/hostBeat`]: net.now() });
        if (O.meta && O.meta.status === 'lobby') await net.remove(`${base}/players/${net.uid}`);
        else await net.set(`${base}/players/${net.uid}/online`, false);
      }
    } catch (e) {}
  }
  cleanupOnline(); sess.set('rummi_room', null);
  G = null; stopTurnTimer();
  showScreen('startScreen'); renderStart();
}

/* ---------- 게임: 서버 상태 → 화면용 판(G) ---------- */
// 상대가 판을 바꿀 때 반짝일 타일: 새로 올라온 타일 + 원래 세트에서 떨어져 나온 타일
function movedTiles(prev, next){
  const where = {}; prev.forEach(s => s.forEach(id => where[id] = s));
  const out = [];
  next.forEach(s => { const ns = new Set(s); s.forEach(id => { const ps = where[id]; if (!ps || !ps.every(x => ns.has(x))) out.push(id); }); });
  return out;
}
const byColor = (a, b) => (isJoker(a) || isJoker(b)) ? (isJoker(a) - isJoker(b) || a - b) : (tileColor(a) - tileColor(b) || tileNum(a) - tileNum(b));
const cloneBoard = b => b.map(s => s.slice());

function syncView(){
  const g = O.game; if (!g) return;
  const me = mySeat(); if (me < 0) return;
  const n = g.seats.length, seatOf = k => (me + k) % n;
  const prev = G && G.kind === 'online' && G.gameId === g.gameId ? G : null;
  const myTurn = g.phase === 'play' && g.turn === me;
  // 내 패 순서: 손으로 정리한 순서는 지키고, 새로 받은 타일만 색별로 뒤에
  const hand = O.hand;
  const keep = O.order.filter(id => hand.includes(id));
  O.order = keep.concat(hand.filter(id => !keep.includes(id)).sort(byColor));
  const view = {
    kind: 'online', gameId: g.gameId, code: O.code, mode: g.mode, version: g.v,
    names: [], hands: [], melded: [], seatOf: [],
    current: g.phase === 'play' ? (g.turn - me + n) % n : -1,
    pool: new Array(g.poolCount || 0).fill(0), over: g.phase === 'over', result: null, round: 1,
  };
  for (let k = 0; k < n; k++) {
    const s = g.seats[seatOf(k)];
    view.seatOf.push(seatOf(k));
    view.names.push(k === 0 ? '나' : s.name);
    view.melded.push(!!s.melded);
    view.hands.push(k === 0 ? null : new Array(s.count || 0).fill(-1));
  }
  let turnStarted = false;
  if (myTurn && prev && O.workTurn === g.turnId) {
    // 내 차례 진행 중: 내가 옮기는 판을 그대로 둠
    view.board = prev.board; view.hands[0] = prev.hands[0]; view.turnStart = prev.turnStart;
    const known = new Set(prev.turnStart.hand), extra = hand.filter(id => !known.has(id));
    if (extra.length) { view.hands[0] = view.hands[0].concat(extra); view.turnStart.hand = view.turnStart.hand.concat(extra); }
  } else {
    view.board = cloneBoard(g.board);
    view.hands[0] = O.order.slice();
    view.turnStart = { board: cloneBoard(g.board), hand: O.order.slice() };
    O.previewOn = false;
    if (myTurn) { O.workTurn = g.turnId; O.pvSent = JSON.stringify(g.board); turnStarted = true; }
    else {
      O.workTurn = null;
      const pv = O.preview;
      O.previewOn = !!(pv && g.phase === 'play' && pv.turnId === g.turnId);
      if (O.previewOn) view.board = cloneBoard(pv.board);
    }
    if (O.lastViewBoard) { const mv = movedTiles(O.lastViewBoard, view.board); if (mv.length) flashIds = mv; }
    O.lastViewBoard = cloneBoard(view.board);
  }
  if (myTurn) O.lastViewBoard = cloneBoard(g.board);
  G = view;
  if (!prev || turnStarted) selected.clear();
  [...selected].forEach(id => { if (!G.hands[0].includes(id) && !G.board.some(s => s.includes(id))) selected.delete(id); });

  // 알림: 무슨 일이 있었는지 + 내 차례
  if (g.turnId !== O.lastTurnId || g.log !== O.lastLog) {
    const first = O.lastTurnId === null;
    O.lastTurnId = g.turnId; O.lastLog = g.log;
    if (turnStarted) { toast(first || !g.log ? '내 차례예요' : `${g.log} · 내 차례예요`, false, 3200); glow(); }
    else if (g.log && g.phase === 'play') toast(g.log, /위반|안 맞아/.test(g.log), 2600);
  }
  render();
  // 내 차례 타이머 (심판이 정한 마감 시각 기준)
  const tkey = myTurn && !O.pending ? `${g.turnId}:${g.turnEnds}` : '';
  if (tkey !== O.timerFor) { O.timerFor = tkey; if (tkey) startTurnTimer(); else stopTurnTimer(); }
  // 결과
  if (g.phase === 'over' && g.result && O.resultShown !== g.gameId) {
    O.resultShown = g.gameId;
    stopTurnTimer();
    setTimeout(showOnlineResult, 600);
  }
}
function glow(){ const el = $('turnGlow'); el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); beep(880, 0.08); }

// 상대 칩: 이름 · 등록 표시 · 남은 장 수 · (차례면) 남은 시간
function renderOnlineChips(players){
  const g = O.game; if (!g) return;
  for (let k = 1; k < G.seatOf.length; k++) {
    const s = g.seats[G.seatOf[k]];
    const active = G.current === k && !G.over;
    const crown = O.meta && s.id === O.meta.host ? '👑' : s.cpu ? '🤖' : '';
    const c = document.createElement('div');
    c.className = 'sticker chip' + (active ? ' active' : '') + (active && s.cpu ? ' thinking' : '') + (s.away ? ' away' : '');
    c.innerHTML = `<span class="nm-full">${crown}${esc(s.name)}</span><span class="nm-short">${crown}${esc(s.cpu ? '컴' + s.name.slice(-1) : s.name.slice(0, 3))}</span>`
      + (s.melded ? '<span class="reg">등록</span>' : '')
      + `<span class="cnt"><i class="mini"></i>×${s.count}</span>`
      + (active && !s.cpu && !s.away ? '<span class="left" data-left></span>' : '');
    players.appendChild(c);
  }
  tickOnlineChips();
}
function tickOnlineChips(){
  const el = document.querySelector('#players [data-left]');
  if (!el || !O.game || !net) return;
  el.textContent = Math.max(0, Math.ceil((O.game.turnEnds - net.now()) / 1000));
}

/* ---------- 내 조작 → 심판에게 ---------- */
function onlineLocalChange(){
  O.order = G.hands[0].concat(O.order.filter(id => !G.hands[0].includes(id)));
  if (G.current !== 0 || G.over || !O.game || O.workTurn !== O.game.turnId) return;
  if (O.pvTimer) return;            // 이미 보낼 예정 — 그때 최신 판을 보냄
  O.pvTimer = setTimeout(() => { O.pvTimer = null; sendPreview(); }, CONFIG.ONLINE.PREVIEW_MS);
}
function sendPreview(){
  if (!G || G.kind !== 'online' || G.current !== 0 || O.pending || !O.game || O.workTurn !== O.game.turnId) return;
  const key = JSON.stringify(G.board); if (key === O.pvSent) return;
  O.pvSent = key;
  net.set(`rooms/${O.code}/preview`, { turnId: O.game.turnId, board: G.board.length ? G.board : null, t: net.now() }).catch(() => {});
}
function sendOnline(kind, board){
  O.pending = true; O.pendingAt = Date.now();
  clearTimeout(O.pvTimer); O.pvTimer = null;
  selected.clear();
  if (O.isHost) {
    const r = O.engine.act(mySeat(), kind, board);
    if (!r.ok) toast(r.reason, true, 3600);
  } else {
    net.push(`rooms/${O.code}/actions`, { uid: net.uid, kind, board: board ? cloneBoard(board) : null, turnId: O.game.turnId, t: net.now() })
      .catch(() => { O.pending = false; toast('보내지 못했어요. 인터넷을 확인해 주세요', true); render(); });
  }
  render();
}

/* ---------- 메뉴 · 결과 ---------- */
function showOnlineMenu(){
  const modeTxt = G.mode === 'quick' ? '빠른 판' : '정식';
  showModal(`<h2>메뉴</h2><p class="sub">방 코드 ${O.code} · ${modeTxt} · ${CONFIG.APP_VERSION}${O.isHost ? ' · 내가 심판' : ''}</p><div class="menu-list">
      <button class="btn primary" id="mResume">계속하기</button>
      <button class="btn" id="mWords">용어 풀이 (등록·그룹·연속)</button>
      <button class="btn" id="mRules">규칙 전체 보기</button>
      <button class="btn" id="mLeave">방 나가기</button></div>`,
    m => {
      m.querySelector('#mResume').onclick = closeModal;
      m.querySelector('#mWords').onclick = showWords;
      m.querySelector('#mRules').onclick = showRules;
      m.querySelector('#mLeave').onclick = () => showModal(`<h2>방을 나갈까요?</h2>
        <p class="sub">게임 중에 나가면 내 차례는 자동으로 1장 뽑고 넘어가요.<br>같은 닉네임으로 다시 들어오면 이어서 할 수 있어요.</p>
        <div class="modal-actions"><button class="btn" id="mNo">취소</button><button class="btn pink" id="mYes">나가기</button></div>`,
        mm => { mm.querySelector('#mNo').onclick = closeModal; mm.querySelector('#mYes').onclick = leaveRoom; });
    });
}
function showOnlineResult(){
  const g = O.game; if (!g || !g.result || g.phase !== 'over') return;
  const R = g.result, me = mySeat();
  const title = R.winner === me ? '승리! 🎉' : R.winner >= 0 ? `${esc(g.seats[R.winner].name)} 승리!` : '게임 끝';
  const medal = ['🥇', '🥈', '🥉', '4'];
  const rows = R.rows.map((r, k) => {
    const isMe = r.seat === me;
    const left = r.count === 0 ? '다 냄' : `${r.pts}점`;
    return `<tr class="${isMe ? 'me' : ''}"><td>${medal[k]} ${esc(r.name)}${isMe ? ' (나)' : ''}</td><td>${r.count}장</td><td>${left}</td></tr>`;
  }).join('');
  const host = O.isHost;
  showModal(`<h2>${title}</h2><p class="sub">${esc(R.why || '')}</p>
    <table class="res"><tr><th>순위</th><th>남은 타일</th><th>남은 점수</th></tr>${rows}</table>
    <p class="sub" style="font-size:15px">${host ? '「다시 하기」를 누르면 모두 대기실로 모여요 (새 친구도 들어올 수 있어요)' : '방장이 「다시 하기」를 누르면 대기실로 모여요'}</p>
    <div class="modal-actions"><button class="btn" id="mLeave">나가기</button>${host ? '<button class="btn primary" id="mAgain">다시 하기</button>' : ''}</div>`,
    m => {
      m.querySelector('#mLeave').onclick = leaveRoom;
      const a = m.querySelector('#mAgain');
      if (a) a.onclick = backToLobby;
    });
}
// 다시 하기: 모두 대기실로 (나간 학생 자리는 정리)
function backToLobby(){
  if (!O.isHost) return;
  const base = `rooms/${O.code}`;
  const upd = { [`${base}/game`]: null, [`${base}/hands`]: null, [`${base}/secret`]: null, [`${base}/preview`]: null, [`${base}/actions`]: null, [`${base}/meta/status`]: 'lobby' };
  for (const [u, p] of Object.entries(O.players)) if (!p || !p.online) upd[`${base}/players/${u}`] = null;
  net.update(upd).catch(() => {});
}

/* ---------- 시작 ---------- */
renderStart();
// 새로고침했으면 같은 방으로 자동으로 돌아가기
(async () => {
  const r = sess.get('rummi_room');
  if (r && onlineReady()) {
    $('nameInput').value = r.name;
    const ok = await joinRoom(r.code, r.name);
    if (ok !== true) sess.set('rummi_room', null);
  }
})();
// 글꼴(Jua, Black Han Sans)을 못 받았으면 굵은 기본 글꼴로 대신
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => {
    // 한글 글자로 확인해야 정확함 (글꼴이 글자 묶음별로 나뉘어 내려오기 때문)
    Promise.all([document.fonts.load('20px Jua', '가'), document.fonts.load('20px "Black Han Sans"', '가1')])
      .then(r => { if (!r[0].length || !r[1].length) document.documentElement.classList.add('nofont'); })
      .catch(() => document.documentElement.classList.add('nofont'));
  });
}
</script>
